[profile.default]
src = "src"
out = "out"
libs = ["lib", "../node_modules"]
remappings = [
    "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 64
depth = 16
fail_on_revert = false
